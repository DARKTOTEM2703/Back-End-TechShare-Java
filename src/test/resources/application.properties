# Test Configuration - H2 In-Memory Database

# Server
server.port=0

# Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=WARN
logging.level.com.techmate.techmate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
JWT_SECRET=test_secret_key_minimum_32_bytes_required_for_hs256
JWT_EXPIRATION_SECONDS=3600

# Email
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# MinIO/S3
minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=techshare-test
minio.bucket=techshare-test

# CORS
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Swagger
springdoc.swagger-ui.enabled=true
