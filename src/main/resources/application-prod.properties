# ============================================
# PRODUCTION PROFILE OVERRIDES
# ============================================
# Este archivo sobrescribe application.properties en perfil PROD

# ============================================
# DATABASE CONFIGURATION (PROD)
# ============================================
# Usar variables de entorno para credenciales
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# ============================================
# JPA/HIBERNATE - MODO SEGURO EN PRODUCCIÓN
# ============================================
# CRÍTICO: En producción SIEMPRE usar "validate"
# NO usar "update" o "create" - esto evita cambios accidentales del schema
# Temporalmente en "none" para debugging
spring.jpa.hibernate.ddl-auto=none

# Desactivar SQL logging en producción (mejora performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN

# Logging detallado de autenticación (temporal para debugging)
logging.level.org.springframework.security=DEBUG
logging.level.com.techmate.techmate.security=DEBUG

# ============================================
# FLYWAY CONFIGURATION (PROD)
# ============================================
# Habilitado para manejar migraciones automáticas
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false

# ============================================
# SECURITY - DESACTIVAR SWAGGER EN PROD
# ============================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ============================================
# CACHE - USAR REDIS EN PRODUCCIÓN
# ============================================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# ============================================
# LOGGING - PRODUCCIÓN
# ============================================
logging.level.root=WARN
logging.level.com.techmate.techmate=INFO
# Log to file in production
logging.file.path=/app/logs

# ============================================
# ACTUATOR - SOLO ENDPOINTS NECESARIOS
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ============================================
# SERVER CONFIGURATION (PROD)
# ============================================
server.compression.enabled=true
server.compression.min-response-size=1024

# Connection timeout (ms)
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

# ============================================
# WARNINGS AND DISABLED SETTINGS
# ============================================
# NO CAMBIAR ESTOS VALORES EN PRODUCCIÓN
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
