# ============================================
# TECHSHARE BACKEND - CORE CONFIGURATION
# ============================================
server.port=8080
server.url=${SERVER_URL}

# ============================================
# DATABASE & MIGRATION (Flyway Master Strategy)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP) - Optimizado para Prod
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway: Único responsable de alterar el esquema
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate: Solo valida, NO toca la estructura
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Naming Strategy: Mapeo automático camelCase (Java) -> snake_case (DB)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# ============================================
# JSON & SERIALIZATION (Global Camel Case)
# ============================================
# Default CAMEL_CASE strategy for Next.js frontend alignment (configured in JacksonConfig)
spring.jackson.default-property-inclusion=non_null

# Límites de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# ============================================
# SECURITY & CORS
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# CORS Configuration: Centralizado, leído por SecurityConfig
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ============================================
# EXTERNAL SERVICES
# ============================================
# Email (Credenciales deben venir de ENV)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Storage & Verification
app.storage.location=${STORAGE_LOCATION}
# Alias usado por implementaciones que inyectan directamente `storage.location`
storage.location=${STORAGE_LOCATION}
app.server-url=${SERVER_URL}
app.verification.url=${VERIFICATION_URL}

# MinIO Configuration
minio.enabled=true
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

# ============================================
# CACHE (Redis / Caffeine)
# ============================================
spring.cache.type=${CACHE_TYPE}
spring.cache.cache-names=categories,subcategories,roles,materials

# Redis Configuration (Opcional, si CACHE_TYPE=redis)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms

# ============================================
# OBSERVABILITY & LOGGING
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Distributed Tracing with Micrometer + Zipkin
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}
spring.application.name=techshare-backend

# Swagger (Deshabilitar en prod via variable de entorno si se desea)
springdoc.api-docs.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.operationsSorter=method

# Logging with TraceId correlation
logging.level.root=INFO
logging.level.com.techmate=INFO
logging.file.path=${LOG_PATH}
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# ============================================
# RESILIENCE4J (Circuit Breaker, Retry, Bulkhead)
# ============================================
# Circuit Breaker for MinIO/S3 Storage
resilience4j.circuitbreaker.instances.storage.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.storage.slidingWindowSize=10
resilience4j.circuitbreaker.instances.storage.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.storage.failureRateThreshold=50
resilience4j.circuitbreaker.instances.storage.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.storage.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.storage.automaticTransitionFromOpenToHalfOpenEnabled=true

# Circuit Breaker for Email Service
resilience4j.circuitbreaker.instances.email.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.email.slidingWindowSize=10
resilience4j.circuitbreaker.instances.email.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.email.failureRateThreshold=50
resilience4j.circuitbreaker.instances.email.waitDurationInOpenState=15s

# Retry Pattern
resilience4j.retry.instances.storage.maxAttempts=3
resilience4j.retry.instances.storage.waitDuration=500ms
resilience4j.retry.instances.storage.retryExceptions=java.io.IOException,java.util.concurrent.TimeoutException

resilience4j.retry.instances.email.maxAttempts=3
resilience4j.retry.instances.email.waitDuration=1s

# Bulkhead (Thread Isolation)
resilience4j.bulkhead.instances.storage.maxConcurrentCalls=10
resilience4j.bulkhead.instances.storage.maxWaitDuration=1s

resilience4j.bulkhead.instances.email.maxConcurrentCalls=5
resilience4j.bulkhead.instances.email.maxWaitDuration=2s

# Time Limiter
resilience4j.timelimiter.instances.storage.timeoutDuration=5s

# ============================================
# KAFKA - EVENT-DRIVEN ARCHITECTURE
# ============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Consumer Configuration
spring.kafka.consumer.group-id=techshare-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
resilience4j.timelimiter.instances.email.timeoutDuration=10s