# ============================================
# TECHSHARE BACKEND - APPLICATION PROPERTIES
# ============================================

spring.application.name=techmate_inventory
server.port=8080
server.url=${SERVER_URL:http://localhost:8080}

# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/techmate_inventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
# JPA/HIBERNATE CONFIGURATION
# ============================================
# ✅ UPDATE: Crea o modifica tablas si es necesario
# Permite que Hibernate cree las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Mejora performance y evita lazy loading exceptions
spring.jpa.open-in-view=false

# ===================================
# HIBERNATE NAMING STRATEGY
# ===================================
# ✅ AUTO-CONVERSIÓN: camelCase → snake_case
# ✅ SubCategories.subCategoryId → sub_categories.sub_category_id
# ✅ Compatible con cualquier sistema operativo (Windows/Linux)
# ✅ No requiere @Column manual, mapeo automático
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# ============================================
# HIBERNATE LOGGING - DETECTAR N+1 QUERIES
# ============================================
# Muestra SQL generado con formato
logging.level.org.hibernate.SQL=DEBUG
# Muestra los valores de los parámetros
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Muestra estadísticas de queries
logging.level.org.hibernate.stat=DEBUG
spring.jpa.properties.hibernate.generate_statistics=true
# Añade comentarios al SQL para identificar origen
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# FLYWAY MIGRATION CONFIGURATION
# ============================================
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=false
# ⚠️ TEMPORAL: Deshabilitar validación para migraciones en desarrollo
spring.sql.init.mode=never

# ============================================
# CONNECTION POOL (HikariCP) - OPTIMIZACIÓN
# ============================================
# HikariCP settings: ajusta según la carga esperada y recursos del entorno.
# Valores razonables para entornos de staging/producción pequeños/medianamente cargados.
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# ============================================
# APPLICATION CUSTOM PROPERTIES
# ============================================
# URL base del servidor (usado para construir URLs de imágenes)
app.server-url=${SERVER_URL:http://localhost:8080}

# Directorio de almacenamiento de imágenes
# ============================================
# JACKSON CONFIGURATION - JSON SERIALIZATION
# ============================================
# Deshabilitar la conversión automática de camelCase a snake_case
# Dejaremos que Lombok y los nombres de campos naturales hagan el trabajo
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.default-property-inclusion=non_null

app.storage.location=${STORAGE_LOCATION:uploaded-images}

# CORS - Orígenes permitidos
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Propiedad usada por la configuración de seguridad (lista CSV)
# Formato: http://localhost:3000,http://localhost:3001
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# URL de verificación de email (debe apuntar al frontend)
app.verification.url=${VERIFICATION_URL:http://localhost:3000/verify?token=}

# ============================================
# EMAIL CONFIGURATION
# ============================================
# IMPORTANTE: Las credenciales están en variables de entorno (.env)
# NUNCA hardcodear credenciales en este archivo
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# ============================================
# SWAGGER/OPENAPI CONFIGURATION
# ============================================
# Swagger habilitado por defecto en desarrollo, deshabilitado en producción
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api-docs

# Configuración adicional de Swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# JSON naming strategy: use snake_case for API payloads
spring.jackson.property-naming-strategy=SNAKE_CASE

# ============================================
# SPRING BOOT ACTUATOR - MONITORING
# ============================================
# Endpoints de monitoreo y salud de la aplicación
management.endpoints.web.exposure.include=health,info,metrics,caches,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.caches.enabled=true
management.info.env.enabled=true

# Custom app info para Actuator
info.app.name=TechShare Backend API
info.app.description=Sistema de gestión de inventario y préstamos educativos
info.app.version=0.2.0
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Información de la aplicación
info.app.name=TechShare Backend
info.app.description=Sistema de gestión de inventario y préstamos
info.app.version=@project.version@
info.app.java-version=@java.version@

# ============================================
# CACHE CONFIGURATION
# ============================================
# Cache Type: redis (distributed) or caffeine (local)
spring.cache.type=${CACHE_TYPE:caffeine}

# Caffeine Cache (Local - para desarrollo)
spring.cache.cache-names=categories,subcategories,roles,materials
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m,recordStats

# Redis Cache (Distributed - para producción multi-instancia)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# ============================================
# LOGGING CONFIGURATION
# ============================================
# Log file path (para JSON logs)
logging.file.path=${LOG_PATH:logs}
logging.level.root=INFO
logging.level.com.techmate.techmate=DEBUG

# ============================================
# ASYNC PROCESSING
# ============================================
# Thread pool para eventos asíncronos
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-
