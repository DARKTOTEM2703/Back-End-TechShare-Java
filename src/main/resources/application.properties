# ============================================
# TECHSHARE BACKEND - CORE CONFIGURATION
# ============================================
spring.application.name=techmate_inventory
server.port=8080
server.url=${SERVER_URL:http://localhost:8080}

# ============================================
# DATABASE & MIGRATION (Flyway Master Strategy)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) - Optimizado para Prod
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Flyway: Único responsable de alterar el esquema
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate: Solo valida, NO toca la estructura
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Naming Strategy: Mapeo automático camelCase (Java) -> snake_case (DB)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# ============================================
# JSON & SERIALIZATION (Global Snake Case)
# ============================================
# Alineado con el Frontend Next.js y JacksonConfig
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# Límites de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# ============================================
# SECURITY & CORS
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration: Centralizado, leído por SecurityConfig
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ============================================
# EXTERNAL SERVICES
# ============================================
# Email (Credenciales deben venir de ENV)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Storage & Verification
app.storage.location=${STORAGE_LOCATION:uploaded-images}
# Alias usado por implementaciones que inyectan directamente `storage.location`
storage.location=${STORAGE_LOCATION:${app.storage.location:uploaded-images}}
app.server-url=${SERVER_URL:http://localhost:8080}
app.verification.url=${VERIFICATION_URL:http://localhost:3000/verify?token=}

# ============================================
# CACHE (Redis / Caffeine)
# ============================================
spring.cache.type=${CACHE_TYPE:caffeine}
spring.cache.cache-names=categories,subcategories,roles,materials

# Redis Configuration (Opcional, si CACHE_TYPE=redis)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# ============================================
# OBSERVABILITY & LOGGING
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Swagger (Deshabilitar en prod via variable de entorno si se desea)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.root=INFO
logging.level.com.techmate=INFO
logging.file.path=${LOG_PATH:logs}