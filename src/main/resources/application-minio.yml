# application-minio.yml
# MinIO Storage Configuration Profile
# Activated via: -Dspring-boot.run.profiles=minio
# All runtime values are read from environment variables (.env)

app:
  storage:
    type: ${APP_STORAGE_TYPE}

minio:
  endpoint: ${MINIO_ENDPOINT}
  region: ${MINIO_REGION:us-east-1}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  secure: false
