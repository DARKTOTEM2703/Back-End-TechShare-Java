# Configuración de Testing con H2 Database en memoria
spring.application.name=techmate_inventory_test

# Base de datos H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway DESHABILITADO para tests (usamos JPA create-drop)
spring.flyway.enabled=false
spring.sql.init.mode=never

# Desactivar email en tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# Storage location para tests
storage.location=test-uploaded-images

# Server URL para tests
server.url=http://localhost:8080

# JWT para tests: no incluir un secreto real en el repo. CI/entorno local debe definir JWT_SECRET.
JWT_EXPIRATION_SECONDS=3600

# Logging para tests
logging.level.root=INFO
logging.level.com.techmate.techmate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Desactivar open-in-view warning
spring.jpa.open-in-view=false

# URL base para el flujo de verificación (usada en tests)
app.verification.url=http://localhost:8080/verify?token=

# JSON naming strategy: use snake_case for API payloads (misma configuración que producción)
# Jackson uses default CAMEL_CASE strategy (configured in JacksonConfig)
