name: CI/CD - Build, Test & Deploy

on:
  push:
    branches: [dev, main, "release/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch: # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_LC: darktotem2703/back-end-techshare-java
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  # ========================================
  # JOB 1: CODE QUALITY & SECURITY
  # ========================================
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: "maven"

      - name: � Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: �🔧 Make mvnw executable
        run: chmod +x ./mvnw

      - name: 🔎 Run Dependency Check
        run: |
          echo "### 🔎 Dependency Check" >> $GITHUB_STEP_SUMMARY
          ./mvnw dependency:tree -B | tee dependency-tree.txt
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          head -n 50 dependency-tree.txt >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 🛡️ OWASP Dependency Check (Optional)
        continue-on-error: true
        run: |
          echo "Skipping OWASP check for faster CI (enable in production)"
          # ./mvnw org.owasp:dependency-check-maven:check -B

  # ========================================
  # JOB 2: BUILD AND TEST
  # ========================================
  build-and-test:
    name: 🏗️ Build and Test Backend
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: admin1
          MYSQL_DATABASE: techmate_inventory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -padmin1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: "maven"

      - name: � Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: �🔧 Make mvnw executable
        run: chmod +x ./mvnw

      - name: 🔍 Verify MySQL connection
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          for i in {1..30}; do
            if mysql --host 127.0.0.1 --port 3306 -uroot -padmin1 -e "SHOW DATABASES" 2>/dev/null; then
              echo "✅ MySQL is ready!"
              break
            fi
            echo "⏳ Waiting for MySQL... ($i/30)"
            sleep 2
          done
          mysql --host 127.0.0.1 --port 3306 -uroot -padmin1 -e "SHOW DATABASES"

      - name: 🧪 Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/techmate_inventory_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: admin1
          JWT_SECRET: test-secret-key-for-ci-pipeline-minimum-32-characters-required
          SWAGGER_ENABLED: false
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean test -B

      - name: 🏗️ Build JAR
        run: ./mvnw clean package -DskipTests -B

      - name: 🔎 List test report files (debug)
        if: always()
        run: |
          echo "Listing any XML under target directories (for test reports)"
          find . -type f -path "*/target/*surefire-reports/*.xml" -print || true
          find . -type f -path "*/target/**/surefire-reports/*.xml" -print || true
          echo "Listing target/ tree (first 200 lines)"
          ls -R target 2>/dev/null | sed -n '1,200p' || true

      - name: 📊 Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure() # Run even if tests fail
        with:
          name: Maven Tests
          # More tolerant pattern to match surefire reports in nested modules
          path: '**/target/**/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false # Don't fail the workflow on reporter errors
          fail-on-empty: false # Don't error if no report files are found

      - name: 📦 Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: techmate-backend-jar
          path: target/*.jar
          retention-days: 5

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          # Upload any surefire/failsafe report directories
          path: '**/target/**/surefire-reports/'
          retention-days: 30

      - name: ✅ Build Summary
        if: always()
        run: |
          echo "### 🎯 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** ${{ env.JAVA_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if ls **/target/**/surefire-reports/*.xml 1> /dev/null 2>&1; then
            TEST_COUNT=$(grep -c "testcase" **/target/**/surefire-reports/*.xml || echo "0")
            echo "- **Tests Run:** $TEST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi

  # ========================================
  # JOB 3: DOCKER BUILD & PUSH
  # ========================================
  docker-build-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU and buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # CORREGIDO: Contexto es el root del repo
          file: ./Dockerfile # CORREGIDO: Dockerfile está en el root
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          # REAL SOLUTION: Registry-based cache with docker-container driver
          # The docker-container driver ENABLES cache export to registries
          # Must use lowercase repository name for registry cache export
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:buildcache,mode=max

      - name: 📊 Docker Summary
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY

  # ========================================
  # JOB 4: DEPLOY TO STAGING (DEV BRANCH)
  # ========================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    # environment:
    #   name: staging
    #   url: https://staging.techshare.example.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy notification
        run: |
          echo "### 🚀 Deploying to Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://staging.techshare.example.com" >> $GITHUB_STEP_SUMMARY

    # Ejemplo de deployment a servidor (ajustar según infraestructura)
    # - name: 🔧 Deploy to staging server
    #   uses: appleboy/ssh-action@master
    #   with:
    #     host: ${{ secrets.STAGING_HOST }}
    #     username: ${{ secrets.STAGING_USER }}
    #     key: ${{ secrets.STAGING_SSH_KEY }}
    #     script: |
    #       cd /opt/techshare
    #       docker-compose pull backend
    #       docker-compose up -d backend
    #       docker-compose logs -f --tail=50 backend

  # ========================================
  # JOB 5: DEPLOY TO PRODUCTION (MAIN BRANCH)
  # ========================================
  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # environment:
    #   name: production
    #   url: https://api.techshare.example.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🌟 Production deployment notification
        run: |
          echo "### 🌟 Deploying to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://api.techshare.example.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Manual approval required for production deployments**" >> $GITHUB_STEP_SUMMARY

      # Ejemplo de deployment a producción (ajustar según infraestructura)
      # - name: 🔧 Deploy to production server
      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.PROD_HOST }}
      #     username: ${{ secrets.PROD_USER }}
      #     key: ${{ secrets.PROD_SSH_KEY }}
      #     script: |
      #       cd /opt/techshare
      #       docker-compose pull backend
      #       docker-compose up -d backend
      #       docker-compose logs -f --tail=50 backend

      - name: 🎉 Deployment complete
        run: |
          echo "🎉 Production deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
