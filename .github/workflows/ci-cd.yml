name: TechShare Backend CI/CD

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/techshare-backend

jobs:
  # ============================================
  # BUILD & TEST
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (compile only)
        run: ./mvnw -B -DskipTests=true clean compile
        
      - name: Run tests
        run: ./mvnw -B test
        
      - name: Build JAR package
        run: ./mvnw -B -DskipTests=true package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-build
          path: target/*.jar
          retention-days: 7

  # ============================================
  # CODE QUALITY & SECURITY CHECKS
  # ============================================
  quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check for security vulnerabilities in dependencies
        run: ./mvnw dependency-check:check || true

      - name: Build with Maven (for analysis)
        run: ./mvnw -B -DskipTests=true clean compile

  # ============================================
  # DOCKER BUILD & PUSH
  # ============================================
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: Back-End-TechShare-Java
          file: Back-End-TechShare-Java/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # DEPLOY TO STAGING
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/dev'
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "🚀 Deploying to Staging..."
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"

      # Placeholder for actual deployment logic
      # Replace with your deployment tool (e.g., kubectl, docker-compose, etc.)
      - name: Deploy via SSH (example)
        if: false  # Disable until configured
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/techshare
            docker-compose pull
            docker-compose up -d

      - name: Health check (placeholder)
        run: |
          echo "✅ Staging deployment initiated"
          echo "Note: Configure actual deployment in secrets and workflow"

  # ============================================
  # NOTIFICATIONS
  # ============================================
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [ build, quality ]
    if: always()

    steps:
      - name: Set status message
        id: status
        run: |
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.quality.result }}" == "success" ]; then
            echo "message=✅ Build & Tests PASSED" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "message=❌ Build or Tests FAILED" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Print summary
        run: |
          echo "## Build Summary 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Result**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Check**: ${{ needs.quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
